name: Publish

# main publishes a snapshot; a release tag (bare version, created by
# `./gradlew release`) releases that version.
on:
  push:
    branches: [main]
    tags: ['[0-9]*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - name: Publish snapshot
        if: github.ref_type == 'branch'
        run: |
          if grep -q '^version=.*-SNAPSHOT$' gradle.properties; then
            ./gradlew publishToMavenCentral
          else
            echo "Not a snapshot version; skipping."
          fi
      - name: Release
        if: github.ref_type == 'tag'
        # Snapshots are unsigned: an empty key would still enable signing.
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if ! grep -qx "version=${GITHUB_REF_NAME}" gradle.properties; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the version in gradle.properties"
            exit 1
          fi
          ./gradlew publishAndReleaseToMavenCentral
